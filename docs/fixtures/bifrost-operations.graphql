  categories
  favourite
  favouriteMarketIds
  ...MatchBase
  ...MatchStream
  ...MatchMarketGroups
  ...MatchMainMarketGroups
  ...MatchSimpleScore
  ...MatchGameClientInfo
}

# ---- fragment MatchBase
fragment MatchBase on Match {
  id
  datePlannedStart
  state
  prematchOnly
  name
  hasObb
  ...MatchTeams
  ...MatchTournament
}

# ---- fragment MatchGameClientInfo
fragment MatchGameClientInfo on Match {
