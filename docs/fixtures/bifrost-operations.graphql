# ---- query allMatch
query allMatch($after: String, $before: String, $first: Int, $last: Int, $sportType: SportType, $liveOnly: Boolean, $sports: [ID!], $tournaments: [ID!], $historic: Boolean, $favourites: Boolean, $search: String, $dateFrom: String, $dateTo: String, $sort: SortType) {
  allMatch(
    after: $after
    before: $before
    first: $first
    last: $last
    sportType: $sportType
    liveOnly: $liveOnly
    sports: $sports
    tournaments: $tournaments
    historic: $historic
    favourites: $favourites
    text: $search
    dateFrom: $dateFrom
    dateTo: $dateTo
    sort: $sort
  ) {
    edges {
      node {
        ...TimelineMatch
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    total
  }
}

# ---- query allMatchSearch
query allMatchSearch($first: Int, $search: String, $historic: Boolean) {
  allMatch(first: $first, text: $search, historic: $historic) {
    edges {
      node {
        id
        ...MatchBase
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    total
  }
}

# ---- query allOutrights
query allOutrights($after: String, $first: Int, $sports: [ID!], $tournaments: [ID!], $historic: Boolean, $favourites: Boolean, $search: String) {
  allOutrights(
    after: $after
    first: $first
    sports: $sports
    tournaments: $tournaments
    historic: $historic
    favourites: $favourites
    text: $search
  ) {
    edges {
      node {
        ...TimelineOutrights
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    total
  }
}

# ---- query allUserTicket
query allUserTicket($after: String, $first: Int, $dateFrom: String, $dateTo: String, $statuses: [TicketStatus!], $search: String) {
  allUserTickets(
    after: $after
    first: $first
    dateFrom: $dateFrom
    dateTo: $dateTo
    statuses: $statuses
    text: $search
  ) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        ...UserTicket
      }
      cursor
    }
  }
}

