# ---- query ticketRestrictions
query ticketRestrictions($ticket: TicketInput!) {
  restrictions(ticket: $ticket) {
    bets {
      restrictions {
        ... on MinStakeRestriction {
          stake
          violated
        }
        ... on MaxStakeRestriction {
          stake
          violated
        }
        ... on MinOddsRestriction {
          odds
          violated
        }
        ... on OutcomeStateRestriction {
          id
          state
          violated
        }
        ... on OutcomeOddsRestriction {
          id
          odds
          violated
        }
        ... on InvalidCombinationRestriction {
          outcomeIds
          independenceId
        }
        ... on EventNotFoundRestriction {
          outcomeId
        }
        ... on DuplicateTeamRestriction {
          outcomeId
        }
        ... on CorrelatedMarketRestriction {
          outcomeId
        }
        ... on ObbMinOutcomesRestriction {
          matchId
          violated
        }
        ... on ObbInvalidSessionRestriction {
          eventId
        }
      }
    }
  }
}

