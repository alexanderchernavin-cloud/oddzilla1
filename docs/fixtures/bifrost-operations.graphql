}

# ---- fragment MatchMainMarketGroups
fragment MatchMainMarketGroups on Match {
  mainMarketGroups {
    id
    name
    namePrefix
    layoutType
    independenceId
    selections {
      id
      name
    }
    markets {
      id
      info
      state
      outcomes {
        id
        odds
        status
      }
    }
  }
}

# ---- fragment MatchMarketGroups
fragment MatchMarketGroups on Match {
  marketGroups {
