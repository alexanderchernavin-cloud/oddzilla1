# Oddzilla — single-box Docker Compose (Hetzner CPX31 target;
# upgraded from CPX22 on 2026-05-11). Every service is designed so it
# can be moved to a separate box by changing hostnames in `.env`; no
# localhost assumptions in code.

name: oddzilla

x-healthcheck-defaults: &hc
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 10s

# Per-service log rotation. Without this the JSON log driver writes
# unbounded files into /var/lib/docker/containers/*-json.log and one
# busy service (feed-ingester during AMQP recovery) can fill the box's
# disk over a few days. See project_disk_full_incident memory.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Sandbox profile applied to every long-running service. cap_drop ALL
# strips the default Linux capability set; only the few services that
# need a capability re-add it explicitly. no-new-privileges blocks any
# in-container exec from regaining a capability via setuid.
x-sandbox: &sandbox
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL

x-go-service: &go-service
  <<: *sandbox
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  env_file: .env
  logging: *default-logging
  mem_limit: 320m
  # CPU cap per Go service. Box is 2 vCPU; without caps a runaway loop
  # in any one service starves the rest (an admin endpoint seq-scanning
  # a hot table has been observed pegging both cores and dropping
  # ws-gateway / feed-ingester to milliseconds). Per-service caps
  # oversubscribe in aggregate (sum > 2.0) which is fine — they only
  # bind under contention.
  cpus: 0.75

x-ts-service: &ts-service
  <<: *sandbox
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  env_file: .env
  logging: *default-logging

# Next.js storefront runs as N identical replicas fronted by Caddy
# (lb_policy least_conn). SSR is single-threaded per Node process; one
# replica saturates one vCPU under load. Three replicas use ~3 of the
# 4 vCPU on CPX31, leaving one core for api / postgres / ws-gateway.
#
# Per-replica mem_limit was set to 400M in the original split, which
# the 2026-05-11 5000-VU load test proved too tight — each replica's
# working set climbs to ~370-400 MiB under heavy concurrent SSR
# (Node heap + per-request buffers + connection state) and Docker
# OOM-killed web2 + web3 multiple times during the run. 700M each =
# 2.1 GiB total for web, still comfortably under the 8 GiB box budget
# (postgres 1G + api 512M + ws-gateway 256M + 5 Go workers @ 320M +
# redis 320M + caddy 256M + metrics 64M + signer 64M = ~5.6 GiB
# committed including web).
#
# The image, env, and healthcheck are all identical — only the
# REPLICA_NAME differs so a log line identifies which container
# produced it.
x-web: &web-base
  <<: *sandbox
  restart: unless-stopped
  logging: *default-logging
  mem_limit: 700m
  # Each Next.js process is single-threaded for SSR. The original
  # 0.75 cap pinned every replica at 75% of one core during the 1500-
  # VU load test (see docker-stats samples in docs/LOADTEST.md) —
  # cgroup throttling, not host saturation: the 4-vCPU box still had
  # ~1.2 cores free at peak. 1.0 lets each replica fully use one
  # core; 3 replicas = 3 cores, leaving 1 for api + postgres + caddy.
  cpus: 1.0
  build:
    context: .
    dockerfile: apps/web/Dockerfile
  # Pin a shared image name so `docker compose build web1` produces the
  # SAME tag web2 + web3 then start from. Without this, Compose names
  # each service's image after the service (`oddzilla-web1`, `oddzilla-
  # web2`, …) and you end up building three identical images per deploy
  # or hand-tagging them. Building web1 alone now feeds all three.
  image: oddzilla-web:latest
  # No `env_file: .env` here by design: the internet-facing web tier must
  # NOT carry server secrets (JWT_SECRET, REFRESH_COOKIE_SECRET,
  # POSTGRES_PASSWORD, ODDIN_TOKEN, ...). JWTs are HS256 (symmetric), so a
  # web RCE able to read the secret from process.env could FORGE admin
  # tokens — the exact escalation apps/web/src/lib/auth.ts documents as
  # foreclosed. Each web service below lists only the non-secret runtime
  # vars it actually reads (grep apps/web/src for process.env); Compose
  # still interpolates ${...} from .env at parse time, which never enters
  # the container environment.
  depends_on:
    - api
    - ws-gateway
  healthcheck:
    <<: *hc
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${WEB_PORT:-3000}/healthz"]

services:
  postgres:
    # Pinned by manifest-list digest. Refresh: docker buildx imagetools
    # inspect postgres:16-alpine.
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1024m
    cpus: 1.5
    security_opt:
      - "no-new-privileges:true"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oddzilla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong}
      POSTGRES_DB: ${POSTGRES_DB:-oddzilla}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"      # localhost-only; Caddy never fronts this
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-oddzilla} -d $${POSTGRES_DB:-oddzilla}"]
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "max_connections=100"

  redis:
    image: redis:7-alpine@sha256:286bd4264adb303147270bb2d735352497e950f7b73b2ca42364d63d7daf61ee
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 320m
    cpus: 0.5
    # Pin to redis user (UID 999 inside redis:7-alpine) from the very
    # first exec. Side-steps the entrypoint's "run as root, chown,
    # then setpriv-to-redis" startup path entirely. We had a 2026-05-21
    # outage where cap_drop ALL stripped CAP_DAC_OVERRIDE; the
    # root-stage entrypoint then could not enter the existing
    # mode-700 appendonlydir owned by redis, and the container went
    # into a crashloop. Running as redis from the start means there's
    # no root stage to need DAC_OVERRIDE, and the chown step is moot
    # (data dir is already redis-owned from previous runs).
    user: "999:999"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      <<: *hc
      test: ["CMD", "redis-cli", "ping"]

  caddy:
    image: caddy:2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    restart: unless-stopped
    logging: *default-logging
    # 96M was pinned at the ceiling under load (the 2026-05-11 5000-VU
    # run kept it at 95-96 MiB the entire time, occasionally throwing
    # 503s when buffers couldn't allocate). 256M gives breathing room
    # for TLS session caching + per-upstream connection pool at the
    # fan-out tier (3 web replicas × N upstreams + api + ws-gateway).
    mem_limit: 256m
    # Bumped 0.5 -> 1.0 after the 1500-VU run: Caddy hit ~50% on its
    # 0.5 cap (= pinned) during the test; under TLS handshake + zstd
    # encoding for thousands of concurrent connections it needs one
    # whole core. Still oversubscribed with web (3 × 1.0) + postgres
    # (1.5) + api (1.0) on a 4-vCPU host, but only web is sustained-
    # contended; Caddy CPU spikes are bursty and brief.
    cpus: 1.0
    # Caddy needs to bind privileged ports 80 and 443. cap_drop ALL strips
    # every capability and we only re-add NET_BIND_SERVICE so a Caddy RCE
    # cannot, for example, modify routing tables (NET_ADMIN) or read raw
    # sockets (NET_RAW). no-new-privileges blocks regaining anything via
    # in-container setuid binaries.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # Static APK distribution for the Android app. /srv/oddzilla-apk
      # on the host holds version.json + oddzilla-<version>.apk files;
      # a release is `scp` + edit-version.json (no Caddy restart). The
      # mount is read-only so a Caddy RCE can't tamper with installer
      # bytes en route to user devices. Bootstrap the directory once
      # via infra/hetzner/oddzilla-apk-init.sh.
      - /srv/oddzilla-apk:/srv/oddzilla-apk:ro
      # Team-logo library served at /logos/* (see Caddyfile). ~2.5 GB image
      # tree kept out of the web image + git; synced with rsync to the host
      # dir. Read-only so a Caddy RCE can't tamper with served assets.
      # Bootstrap once via infra/hetzner/oddzilla-logos-init.sh.
      - /srv/oddzilla-logos:/srv/oddzilla-logos:ro
    environment:
      FRONTEND_HOST: ${FRONTEND_HOST:-localhost}
      ADMIN_HOST: ${ADMIN_HOST:-admin.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    depends_on:
      # web1 always runs; web2 + web3 join under the `scaled` profile in
      # production. Caddy's active health checks ride out their startup
      # gap — listing them as deps would tangle dev (no `scaled` profile)
      # into an unresolvable wait.
      - web1
      - api
      - ws-gateway

  signer:
    # Holds HD_MASTER_MNEMONIC. The API and the (future) withdrawal
    # broadcaster talk to it over a Unix socket on a shared volume —
    # never over the network. cap_drop ALL + no-new-privileges + a
    # read_only rootfs mean RCE inside this container yields a process
    # that cannot escalate, persist anywhere, or reach the internet.
    # The mnemonic itself is unset from the environment as soon as the
    # binary parses it (see cmd/signer/main.go), so /proc/<pid>/environ
    # is uninteresting after boot. The container runs as UID 1000
    # directly (matches signer-socket's pre-owned tmpfs) so we never
    # need CAP_CHOWN.
    build:
      context: ./services/signer
      dockerfile: Dockerfile
    user: "1000:1000"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    cpus: 0.25
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    env_file: .env
    environment:
      SIGNER_SOCKET_PATH: /run/signer/signer.sock
      HEALTH_PORT: 8086
    volumes:
      - signer-socket:/run/signer
    # Host port binding lives in docker-compose.dev.yml — prod exposes
    # only Caddy on 80/443. The api talks to the signer via the Unix
    # socket on signer-socket; nothing else needs the health port.
    healthcheck:
      <<: *hc
      # Distroless static has no wget/curl. The signer binary supports
      # a -healthcheck self-probe that dials its own /healthz and exits 0/1.
      test: ["CMD", "/signer", "-healthcheck"]

  api:
    <<: *ts-service
    mem_limit: 512m
    cpus: 1.0
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      SERVICE_NAME: api
      PORT: ${API_PORT:-3001}
      SIGNER_SOCKET_PATH: /run/signer/signer.sock
      # Where /admin/deploy/* reads from. These match the bind mounts
      # below — if the operator's checkout sits somewhere other than
      # /home/team/oddzilla, override DEPLOY_STATE_HOST + DEPLOY_GIT_HOST
      # in .env so the compose-level bind sources move with it.
      DEPLOY_STATE_DIR: /srv/deploy-state
      DEPLOY_GIT_DIR: /srv/repo-git
      # FCM push-notification credential path inside the container.
      # The api looks for `service-account.json` inside the mounted
      # /run/firebase directory; when the file is absent the push-outbox
      # worker (services/api/src/modules/push) logs `firebase: disabled`
      # and marks rows with last_error=firebase_disabled instead of
      # dispatching. To activate, drop the Firebase Admin SDK service
      # account JSON at FIREBASE_SERVICE_ACCOUNT_HOST on the host
      # (default /srv/oddzilla-firebase/service-account.json — see
      # apps/mobile-android/.../fcm/README.md) and `make recreate api`.
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-/run/firebase/service-account.json}
    volumes:
      # Read-write because Unix socket clients need to write to the socket
      # file to send requests. cap_drop + the API's existing isolation are
      # the security boundary, not the mount mode.
      - signer-socket:/run/signer
      # Read-only mounts powering the /admin/deploy page:
      #   - .deploy/   — deploy state files (last-sha, log, images/, backups/)
      #   - .git/      — used to enumerate pending commits + diff files
      # Both are read-only — the page is observability only; nothing
      # in api ever writes here. The host paths default to the
      # production server's checkout; override via DEPLOY_STATE_HOST /
      # DEPLOY_GIT_HOST in .env for environments with a different
      # checkout root.
      - ${DEPLOY_STATE_HOST:-/home/team/oddzilla/.deploy}:/srv/deploy-state:ro
      - ${DEPLOY_GIT_HOST:-/home/team/oddzilla/.git}:/srv/repo-git:ro
      # Firebase Admin SDK service-account dir for FCM push.
      # Mount the directory (not the file) so a missing host file
      # does NOT abort `docker compose up` — Docker auto-creates the
      # source dir if absent, the api boots with the worker in
      # graceful-idle mode, and the operator can later drop
      # `service-account.json` into FIREBASE_SERVICE_ACCOUNT_HOST and
      # `make recreate api` to activate. Read-only since the api
      # never writes credentials.
      - ${FIREBASE_SERVICE_ACCOUNT_HOST:-/srv/oddzilla-firebase}:/run/firebase:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      signer:
        condition: service_healthy
    # Host port binding lives in docker-compose.dev.yml — prod exposes only
    # Caddy on 80/443. Healthcheck below uses the container's own loopback.
    healthcheck:
      <<: *hc
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${API_PORT:-3001}/healthz"]

  ws-gateway:
    <<: *ts-service
    mem_limit: 256m
    cpus: 0.5
    build:
      context: .
      dockerfile: services/ws-gateway/Dockerfile
    environment:
      SERVICE_NAME: ws-gateway
      PORT: ${WS_GATEWAY_PORT:-3002}
      # Require an Origin header on every WebSocket upgrade (2026-09-03).
      # Browsers always send one; a bare script or curl does not, so this
      # turns away the naive odds scraper for free. Nothing server-side
      # opens /ws — SSR reads Postgres, the Android app is a WebView — so
      # there is no legitimate Origin-less client to tolerate. Override
      # with CORS_ORIGINS_STRICT=false in .env if one ever appears.
      CORS_ORIGINS_STRICT: ${CORS_ORIGINS_STRICT:-true}
    healthcheck:
      <<: *hc
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${WS_GATEWAY_PORT:-3002}/healthz"]

  # The AI support assistant. Moved here from the operator PC on
  # 2026-09-01: the only thing that ever tied it to a PC was a local
  # LM Studio, and with LM_STUDIO_BASE_URL pointed at a hosted
  # OpenAI-compatible endpoint that anchor is gone. On the box it
  # answers around the clock instead of only while a PC is awake with
  # a model loaded.
  #
  # Still outbound-only. It polls /webhooks/support-ai/* and posts
  # replies; it listens on nothing, which is why the healthcheck reads
  # a liveness file the poll loop touches rather than probing a port.
  #
  # Graceful-idle, the same way every credential-gated service here
  # behaves: with SUPPORT_AI_BOT_TOKEN unset the worker parks, logs a
  # warning and stays healthy rather than exiting — which matters under
  # `restart: unless-stopped`, where an exit would crashloop. So it is a
  # normal always-on service with no profile, and setting the token plus
  # a recreate is all that enables it.
  support-ai-bot:
    <<: *ts-service
    mem_limit: 256m
    cpus: 0.5
    build:
      context: .
      dockerfile: services/support-ai-bot/Dockerfile
    environment:
      SERVICE_NAME: support-ai-bot
      # Same-network call to the api rather than back out through Caddy
      # and in again. The path secret is still the auth, unchanged.
      ODDZILLA_API_BASE: ${SUPPORT_AI_BOT_API_BASE:-http://api:3001}
      LIVENESS_FILE: /tmp/support-ai-bot.alive
    healthcheck:
      <<: *hc
      # Unhealthy when the poll loop has not turned for 90s. The file is
      # touched at the top of each tick (default cadence 4s), before the
      # API call, so an API outage does not restart the container into
      # the same outage — only a wedged or dead loop trips this.
      test:
        [
          "CMD",
          "node",
          "-e",
          "const{statSync}=require('node:fs');process.exit(Date.now()-statSync('/tmp/support-ai-bot.alive').mtimeMs<90000?0:1)",
        ]

  # NOTE: the ZillaBoost graphics-banner worker
  # (services/zillaboost-banner-gen) is deliberately NOT a compose
  # service, and unlike support-ai-bot above it never can be. It runs on
  # the operator PC next to ComfyUI — which is bound to 127.0.0.1 and
  # must stay that way (unauthenticated admin-level code execution if
  # exposed) — and dials OUT to /webhooks/banner-gen/*. A server-side
  # container briefly existed (2026-08-28, via tailscale) and was
  # reverted the same day for exactly that reason.

  web1:
    <<: *web-base
    container_name: oddzilla-web1
    environment:
      # Explicit non-secret allowlist (NO env_file). These are the only
      # vars apps/web reads at runtime (grep apps/web/src for process.env).
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${WEB_PORT:-3000}
      # Next.js standalone binds HOSTNAME; 0.0.0.0 so the loopback
      # healthcheck reaches it.
      HOSTNAME: 0.0.0.0
      FRONTEND_HOST: ${FRONTEND_HOST:-localhost}
      # Shared with Caddy so the app recognizes admin-backoffice requests.
      ADMIN_HOST: ${ADMIN_HOST:-admin.localhost}
      # Server-component → API base over the Docker network.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:3001}
      # NEXT_PUBLIC_* are baked at build; empty at runtime so the browser
      # falls back to same-origin /api + wss://<host>/ws via Caddy.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
      # Locale-preference cookie scope (shared across subdomains).
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # REPLICA_NAME tags every log line so one x-request-id grep finds
      # the SSR render + every API call regardless of replica.
      REPLICA_NAME: web1

  # web2 + web3 are gated on the `scaled` profile so local dev runs a
  # single replica without the cost of three Node processes. Production
  # deploy commands include `--profile scaled` (see CLAUDE.md) so all
  # three come up under one Caddy upstream.
  web2:
    <<: *web-base
    container_name: oddzilla-web2
    profiles: [scaled]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${WEB_PORT:-3000}
      HOSTNAME: 0.0.0.0
      FRONTEND_HOST: ${FRONTEND_HOST:-localhost}
      ADMIN_HOST: ${ADMIN_HOST:-admin.localhost}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:3001}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      REPLICA_NAME: web2

  web3:
    <<: *web-base
    container_name: oddzilla-web3
    profiles: [scaled]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${WEB_PORT:-3000}
      HOSTNAME: 0.0.0.0
      FRONTEND_HOST: ${FRONTEND_HOST:-localhost}
      ADMIN_HOST: ${ADMIN_HOST:-admin.localhost}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:3001}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      REPLICA_NAME: web3

  feed-ingester:
    <<: *go-service
    build:
      context: ./services/feed-ingester
      dockerfile: Dockerfile
    environment:
      SERVICE_NAME: feed-ingester
      HEALTH_PORT: ${FEED_INGESTER_HEALTH_PORT:-8081}
    healthcheck:
      <<: *hc
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${FEED_INGESTER_HEALTH_PORT:-8081}/healthz"]

  odds-publisher:
    <<: *go-service
    build:
      context: ./services/odds-publisher
      dockerfile: Dockerfile
    environment:
      SERVICE_NAME: odds-publisher
      HEALTH_PORT: ${ODDS_PUBLISHER_HEALTH_PORT:-8082}
    healthcheck:
      <<: *hc
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${ODDS_PUBLISHER_HEALTH_PORT:-8082}/healthz"]

  settlement:
    <<: *go-service
    build:
      context: ./services/settlement
      dockerfile: Dockerfile
    environment:
      SERVICE_NAME: settlement
      HEALTH_PORT: ${SETTLEMENT_HEALTH_PORT:-8083}
    healthcheck:
      <<: *hc
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${SETTLEMENT_HEALTH_PORT:-8083}/healthz"]

  # Backup odds + settlement feed from Oddin's Bifrost GraphQL API. Standby
  # by default: publishes onto the `oddin.backup` Redis stream only while
  # feed-ingester's AMQP liveness stamp is stale (BIFROST_MODE=auto). Idles
  # when BIFROST_API_KEY is empty. See docs/BIFROST_BACKUP_FEED.md.
  bifrost-feed:
    <<: *go-service
    build:
      context: ./services/bifrost-feed
      dockerfile: Dockerfile
    mem_limit: 160m
    environment:
      SERVICE_NAME: bifrost-feed
      HEALTH_PORT: ${BIFROST_FEED_HEALTH_PORT:-8086}
    healthcheck:
      <<: *hc
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${BIFROST_FEED_HEALTH_PORT:-8086}/healthz"]

  bet-delay:
    <<: *go-service
    build:
      context: ./services/bet-delay
      dockerfile: Dockerfile
    environment:
      SERVICE_NAME: bet-delay
      HEALTH_PORT: ${BET_DELAY_HEALTH_PORT:-8084}
    healthcheck:
      <<: *hc
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${BET_DELAY_HEALTH_PORT:-8084}/healthz"]

  wallet-watcher:
    <<: *go-service
    build:
      context: ./services/wallet-watcher
      dockerfile: Dockerfile
    environment:
      SERVICE_NAME: wallet-watcher
      HEALTH_PORT: ${WALLET_WATCHER_HEALTH_PORT:-8085}
    healthcheck:
      <<: *hc
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${WALLET_WATCHER_HEALTH_PORT:-8085}/healthz"]

  metrics-collector:
    # Read-only host-metrics service. Holds the three sensitive bind
    # mounts (host /proc, host /, docker.sock) so the api container
    # doesn't have to. cap_drop ALL + no_new_privileges + read_only
    # rootfs + nobody-UID isolation: an RCE here yields a process that
    # cannot escalate, persist anywhere, or call the docker engine for
    # writes (the .sock mount is :ro). Listens on the docker default
    # network only — Caddy never fronts it; only the api container has
    # a reason to reach :9090.
    build:
      context: ./services/metrics-collector
      dockerfile: Dockerfile
    user: "65534:65534"
    # The docker.sock is owned by root:docker mode 660 on the host;
    # UID 65534 (nobody) needs to be in the `docker` group to read it.
    # Hetzner CPX22 dockerd assigns GID 988 (`getent group docker`);
    # adjust if redeploying elsewhere. Note: docker.sock access is
    # functionally equivalent to root on the host (the bind-mount `:ro`
    # only protects the socket *file*, not the engine API), so this
    # container's hardening (cap_drop ALL + no_new_privileges +
    # read_only rootfs + UID nobody) is the only thing standing between
    # an RCE here and a privileged container escape. Future
    # tightening: front docker.sock with tecnativa/docker-socket-proxy
    # so this container only sees a filtered subset (GET /containers).
    group_add:
      - "988"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    cpus: 0.25
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    environment:
      SERVICE_NAME: metrics-collector
      PORT: ${METRICS_COLLECTOR_PORT:-9090}
    volumes:
      # Host /proc → /host/proc:ro for cpu/mem/load/uptime reads.
      - /proc:/host/proc:ro
      # Host root → /host-root:ro for statvfs() on the disk that matters
      # (the Hetzner box's /dev/sda1). `rslave` is required by dockerd
      # whenever the bind source overlaps the daemon root
      # (`/var/lib/docker`); rprivate is rejected. Slave propagation
      # means host mount events propagate INTO the container (so a
      # newly mounted disk shows up live) but no events propagate
      # back OUT — which is what we want for a read-only monitoring
      # mount.
      - /:/host-root:ro,rslave
      # Docker engine API for the container list. :ro so a future
      # exploit cannot `docker run --privileged` from this container.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      <<: *hc
      # Distroless static has no wget/curl. The binary supports a
      # -healthcheck self-probe that dials its own /healthz and exits 0/1.
      test: ["CMD", "/metrics-collector", "-healthcheck"]

  mail-receiver:
    # Inbound SMTP receiver. Accepts mail addressed to oddzilla.cc on
    # port 25 (mapped to container :2525 so the runtime user stays
    # nobody / UID 65534, no NET_BIND_SERVICE needed) and forwards each
    # message to the api's /webhooks/sendgrid-inbound endpoint shaped
    # like a SendGrid Inbound Parse POST. Outbound mail stays at Resend;
    # this container never sends.
    #
    # Why self-hosted: SendGrid (Twilio) rejected the operator's signup
    # citing regional service requirements (2026-05-21). Self-hosting on
    # the Hetzner box gives us a region/industry-neutral inbound path
    # that no third party can ban.
    build:
      context: ./services/mail-receiver
      dockerfile: Dockerfile
    user: "65534:65534"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    cpus: 0.25
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    environment:
      SERVICE_NAME: mail-receiver
      MAIL_RECEIVER_LISTEN: ":2525"
      MAIL_RECEIVER_DOMAIN: ${FRONTEND_HOST}
      MAIL_WEBHOOK_URL: http://api:3001/webhooks/sendgrid-inbound
      SENDGRID_INBOUND_SECRET: ${SENDGRID_INBOUND_SECRET}
    # Bind host port 25 → container 2525. The host port is what the
    # public MX record resolves to; the container's bind stays
    # non-privileged. 0.0.0.0:25 exposes on the public interface so
    # external mail servers can reach us.
    ports:
      - "25:2525"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  # Shared between signer (writes the socket file) and api (read-only
  # mount). Tmpfs so the socket lives in RAM only — restart of the
  # signer recreates it; nothing about the secret material survives a
  # crash on disk.
  signer-socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      # Pre-own the tmpfs volume to UID 1000 / GID 1000 (the signer +
      # api containers' non-root user) so the signer process can create
      # the socket file without needing CAP_CHOWN — which we strip via
      # cap_drop ALL on every service.
      o: "size=4m,mode=750,uid=1000,gid=1000"
